label: field.items
type: structure
translate: false
disabled: true
fields:
  page:
    label: field.page
    type: pages
    multiple: false
    width: 1/3
  title:
    type: text
    width: 1/3
  key:
    label: field.key
    type: text
    required: true
    width: 1/3
  quantity:
    label: field.quantity
    type: number
    required: true
    width: 1/3
  # Whatever a shop keeps with an item, e.g. `data[name]`: a map of its own
  # keys. A structure would validate every value as a row and fail on a string.
  # Extend this field with the `fields` to show, see the personalized products cookbook.
  data:
    type: object
    width: 1/3
  type:
    label: field.type
    type: text
    width: 1/3
  currency:
    label: field.currency
    type: text
    width: 1/4
  price:
    label: field.price
    type: number
    step: .01
    required: true
    width: 1/4
  priceNet:
    label: field.priceNet
    type: number
    step: .01
    required: false
    width: 1/4
  taxRate:
    label: field.taxRate
    type: number
    step: 0.001
    width: 1/4
    translate: false
columns:
  page: true
  quantity: true
  currency: true
  price: true
  type: true
