type: group
fields:
  paymentGateway:
    label: field.paymentGateway
    type: text
    required: true
    width: 1/2
    disabled: true
    translate: false
  datePaid:
    label: field.datePaid
    help: field.datePaid.help
    type: date
    width: 1/2
    time:
      display: HH:mm:ss
      step:
        unit: second
        size: 1
    translate: false
  paymentDetails:
    label: field.paymentDetails
    type: textarea
    font: monospace
    buttons: false
    counter: false
    spellcheck: false
    disabled: true
    translate: false
