type: group
fields:
  dateCreated:
    type: date
    width: 1/3
    time:
      display: HH:mm:ss
      step:
        unit: second
        size: 1
    disabled: true
    translate: false
  datePaid:
    label: field.datePaid
    help: field.datePaid.help
    type: date
    width: 1/3
    time:
      display: HH:mm:ss
      step:
        unit: second
        size: 1
    translate: false
  paymentGateway:
    label: field.paymentGateway
    type: text
    required: true
    width: 1/3
    disabled: true
    translate: false
  items:
    extends: fields/list-items
    width: 2/3
    help: |
      Total: <strong>{{ page.total.toString("price") }}</strong> · Net: {{ page.total.toString("priceNet") }} · Tax: {{ page.total.tax.toString }}
  paymentDetails:
    label: field.paymentDetails
    type: textarea
    font: monospace
    buttons: false
    counter: false
    spellcheck: false
    disabled: true
    translate: false
    width: 1/3
