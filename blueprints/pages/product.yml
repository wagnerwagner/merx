title: page.title.product

fields:
  price:
    extends: fields/price
    width: 1/2
  taxRule:
    extends: fields/tax-rule
    width: 1/2
  stock:
    extends: fields/stock
    width: 1/2

tabs:
  content:
    label: field.content
    icon: draft
    fields:
      - price
      - taxRule
      - stock
  orders:
    label: field.orders
    icon: list-numbers
    fields:
      orders:
        extends: fields/orders
        query: page.orders.flip
