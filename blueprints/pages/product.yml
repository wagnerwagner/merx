title: page.title.product

fields:
  price:
    extends: fields/price
    width: 1/3
  taxRule:
    extends: fields/tax-rule
    width: 1/3
  stock:
    extends: fields/stock
    width: 1/3

tabs:
  content:
    label: field.content
    icon: draft
    fields:
      - price
      - taxRule
      - stock
  orders:
    label: field.orders
    icon: list-numbers
    fields:
      orders:
        extends: fields/orders
        query: page.orders
        columns:
          total: false
          datePaid: false
          quantity:
            label: field.quantity
          price:
            label: field.price
            align: right
          producttotal:
            label: field.total
            align: right
