type: fields
fields:
  dateCreated:
    type: date
    width: 1/2
    time:
      display: HH:mm:ss
      step:
        unit: second
        size: 1
    translate: false
  datePaid:
    type: date
    width: 1/2
    time:
      display: HH:mm:ss
      step:
        unit: second
        size: 1
    translate: false
  items:
    extends: fields/list-items
  infoOrder:
    label: field.info
    type: info
    width: 1/3
    text:
      en: >
        Order Number: {{ page.orderNumber }}<br>
        Total: {{ page.total.toString }}<br>
        Order date: {{ page.dateCreated }}<br>
        Paid date: {{ page.datePaid }}<br>
      de: >
        Bestellnummer: {{ page.orderNumber }}<br>
        Summe: {{ page.total.toString }}<br>
        Bestelldatum: {{ page.dateCreated }}<br>
        Bezahldatum: {{ page.datePaid }}<br>
